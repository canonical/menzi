type: charm
name: workspace
title: Menzi workspace
summary: Menzi workspace service charm
description: Juju machine charm for Menzi workspace service.
base: ubuntu@26.04
platforms:
  amd64:
assumes:
  - juju >= 3.5
provides:
  website:
    interface: http
requires:
  database:
    interface: postgresql_client
  lxd:
    interface: lxd
parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
