bundle: menzi
description: >
  Menzi platform on a Juju machine model. PostgreSQL and NATS JetStream are
  deployed from Charmhub as the platform state stores. Each Menzi service
  unit is a placeholder base container that operators replace with the
  packaged service charm for their deployment.
applications:
  postgresql:
    charm: postgresql
    channel: 16/stable
    num_units: 1
    constraints: mem=2G
  nats:
    charm: nats
    channel: stable
    num_units: 1
    constraints: mem=1G
  core-api:
    charm: ubuntu
    channel: latest/stable
    num_units: 1
    series: jammy
  llm-gateway:
    charm: ubuntu
    channel: latest/stable
    num_units: 1
    series: jammy
  session-proxy:
    charm: ubuntu
    channel: latest/stable
    num_units: 1
    series: jammy
  orchestrator:
    charm: ubuntu
    channel: latest/stable
    num_units: 1
    series: jammy
  supervisor:
    charm: ubuntu
    channel: latest/stable
    num_units: 1
    series: jammy
  previews:
    charm: ubuntu
    channel: latest/stable
    num_units: 2
    series: jammy